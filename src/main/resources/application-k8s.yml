server:
  port: 8083

health:
  message: "Hello from product-service in Helm K8s DEV!"

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: ${DB_URL}
    # H2 인메모리 기본 계정이라 비밀이 아님. 기본값을 둬서 환경변수가 없을 때
    # 플레이스홀더 문자열이 그대로 사용자명이 되는 일을 막음
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /order-h2-console

  cloud:
    function:
      definition: pointsFailed
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS}
      bindings:
        orderCreated-out-0:
          destination: order-created
          content-type: application/json

        pointsFailed-in-0:
          destination: points-failed
          group: order-service

    kubernetes:
      config:
        enabled: false
      discovery:
        enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}