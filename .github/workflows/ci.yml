name: CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/product-service
  MANIFESTS_REPO: ldhbenecia/ldh-infra-lab-manifests
  VALUES_PATH: apps/msa/product-service/values.yaml

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # GHCR push 권한
    outputs:
      image_tag: ${{ steps.sha.outputs.SHORT_SHA }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # 자동 제공, 별도 설정 불필요

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update image tag in manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update image tag
        run: |
          NEW_TAG=${{ needs.build-and-push.outputs.image_tag }}
          cd manifests
          yq e -i ".image.repository = \"${{ env.IMAGE_NAME }}\"" ${{ env.VALUES_PATH }}
          yq e -i ".image.tag = \"$NEW_TAG\"" ${{ env.VALUES_PATH }}
          yq e -i '.image.pullPolicy = "IfNotPresent"' ${{ env.VALUES_PATH }}
          cat ${{ env.VALUES_PATH }} | head -8

      - name: Commit and push
        run: |
          cd manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "ci(product-service): image tag → ${{ needs.build-and-push.outputs.image_tag }}"
          git pull --rebase
          git push
